name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript y Svelte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      # Todas las pruebas de lógica pura del repo (sin red).
      - run: npm test
      - run: npm run check --prefix app
      - run: npm run build --prefix app

  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # tauri-build exige que existan el frontend compilado y los recursos del bundle. Las DLL de mpv
      # no se versionan y las pruebas no las cargan: basta con que la carpeta no esté vacía.
      - run: mkdir -p app/dist app/src-tauri/lib && echo '<!doctype html>' > app/dist/index.html && touch app/src-tauri/lib/.ci
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test
        working-directory: app/src-tauri