name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript y Svelte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      # Todas las pruebas de lógica pura del repo (sin red).
      - run: npm test
      - run: npm run check --prefix app
      - run: npm run build --prefix app

  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri
      # tauri-build exige que existan el frontend compilado y los recursos del bundle. Las DLL de mpv
      # no se versionan y las pruebas no las cargan: basta con que la carpeta no esté vacía.
      - run: mkdir -p app/dist app/src-tauri/lib && echo '<!doctype html>' > app/dist/index.html && touch app/src-tauri/lib/.ci
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test
        working-directory: app/src-tauri