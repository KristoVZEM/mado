# Publica una release de Mado: compila el instalador NSIS, lo firma y lo deja en una release en BORRADOR.
#
# Se dispara al subir una etiqueta `vX.Y.Z` (también `vX.Y.Z-prueba`, que sale como prerelease). La etiqueta debe estar
# sobre `main`. El job usa el Environment `release`, que exige la aprobación de su revisor antes de arrancar y es el
# único sitio donde viven la clave de firma y su contraseña. Nada llega a nadie hasta que el revisor pulsa «Publicar».
name: Publicar release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Compilar, firmar y dejar el borrador
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write # crear el borrador y subirle archivos
      id-token: write # firmar la atestación de procedencia
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: La etiqueta debe estar sobre main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no está sobre main: no se publica."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri

      - run: npm ci --prefix app

      - name: Descargar las DLL de libmpv (verificadas por hash)
        run: node scripts/descargar-libmpv.ts

      - name: Pruebas
        run: npm test

      - name: Compilar, firmar y crear el borrador
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Mado ${{ github.ref_name }}
          releaseBody: Revisar y publicar. Los cambios están en CHANGELOG.md.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Sumas de comprobación
        working-directory: app/src-tauri/target/release/bundle/nsis
        run: |
          ls -la
          sha256sum *-setup.exe *-setup.exe.sig > SHA256SUMS
          cat SHA256SUMS

      - name: Atestación de procedencia del instalador
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Subir SHA256SUMS al borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" app/src-tauri/target/release/bundle/nsis/SHA256SUMS --clobber
