[package]
name = "mado"
version = "0.14.1"
description = "Cliente de escritorio no oficial para ver anime, con libmpv"
authors = ["KristoVZEM"]
license = "MIT"
repository = "https://github.com/KristoVZEM/mado"
edition = "2024"

[lib]
# El sufijo `_lib` evita un conflicto de nombres entre la biblioteca y el binario en Windows.
name = "mado_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-libmpv = "0.3.2"
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
