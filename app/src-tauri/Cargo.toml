[package]
name = "ukiku-pc"
version = "0.1.0"
description = "Cliente de escritorio no oficial inspirado en Ukiku"
authors = ["KristoVZEM"]
edition = "2024"

[lib]
# El sufijo `_lib` evita un conflicto de nombres entre la biblioteca y el binario en Windows.
name = "ukiku_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-libmpv = "0.3.2"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
