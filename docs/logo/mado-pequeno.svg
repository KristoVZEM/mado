<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Mado (versión pequeña)</title>
  <desc>Versión simplificada del logo para tamaños de 48 px o menos: rejilla de 2×2 con cuatro ojos grandes, que se siguen leyendo a 16 px.</desc>
  <defs>
    <g id="ojo">
      <path d="M-20 0 Q0 -17 20 0 Q0 17 -20 0Z" fill="#161616"/>
      <circle r="9" fill="#e8412a"/>
      <ellipse rx="2.3" ry="7" fill="#161616"/>
      <circle cx="-3.4" cy="-3.6" r="1.7" fill="#fff"/>
    </g>
  </defs>
  <rect width="256" height="256" rx="58" fill="#ffe107"/>
  <rect x="44" y="44" width="168" height="168" rx="8" fill="#f5eedc"/>
  <path d="M128 44 V212 M44 128 H212" stroke="#161616" stroke-width="6"/>
  <use href="#ojo" transform="translate(86 86) rotate(-9) scale(1.3)"/>
  <use href="#ojo" transform="translate(171 87) rotate(8) scale(1.2)"/>
  <use href="#ojo" transform="translate(86 171) rotate(6) scale(1.2)"/>
  <use href="#ojo" transform="translate(170 170) rotate(-6) scale(1.3)"/>
  <rect x="44" y="44" width="168" height="168" rx="8" fill="none" stroke="#161616" stroke-width="10"/>
</svg>
